name: Build YouChat APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
    
    - name: Configurar JDK 17 para sdkmanager
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Configurar Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-28 build-tools;28.0.3 platform-tools'
    
    - name: Cambiar a JDK 8 para compilar
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
    
    - name: Cache de Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    
    - name: Dar permisos de ejecución a gradlew
      run: chmod +x ./gradlew
    
    - name: Compilar APK de debug
      run: ./gradlew assembleDebug --stacktrace
    
    - name: Verificar APK generado
      run: |
        if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
          echo "✅ APK generado exitosamente"
          ls -la app/build/outputs/apk/debug/
        else
          echo "❌ No se encontró el APK"
          find app/build -name "*.apk" 2>/dev/null || echo "No se encontraron APKs"
        fi
    
    - name: Subir APK como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: YouChat-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
    
    - name: Crear Release automático
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.run_number }}
        name: Release v${{ github.run_number }}
        body: |
          🚀 Build automático desde commit ${{ github.sha }}
        files: app/build/outputs/apk/debug/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}